[package]
name = "wring"
version = "2.2.6"
edition = "2021"
description = "SSL/TLS Security Testing Toolkit"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
x509-parser = "0.17"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
chrono = "0.4"
rustls = "0.23"
webpki-roots = "1.0.7"
