[package]
name = "leak"
version = "2.8.0"
edition = "2021"
description = "LEAK — Secret scanner: API keys, tokens, credentials, and hardcoded secrets in files and git history"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
regex = "1"
walkdir = "2"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
