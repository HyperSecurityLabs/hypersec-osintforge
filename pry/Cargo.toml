[package]
name = "pry"
version = "2.5.0"
edition = "2021"
description = "Precision Reconnaissance Yield — pry open any domain or IP"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
