[package]
name = "stalk"
version = "3.3.0"
edition = "2021"
description = "STALK — Identity mapper: cross-platform username correlation, GitHub OSINT, breach checks, Google dorking"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
rand = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
sha1 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
