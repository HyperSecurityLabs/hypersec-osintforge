[package]
name = "spoof"
version = "5.0.0"
edition = "2021"
description = "SPOOF — Mail forger: SPF/DMARC/DKIM audit, SMTP relay test, spoofability check, MX misconfiguration detection"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
