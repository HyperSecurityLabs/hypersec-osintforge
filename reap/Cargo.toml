[package]
name = "reap"
version = "4.3.0"
edition = "2021"
description = "Web Intelligence Profiler — reap every detail from the web surface"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "webpki-roots", "socks"] }
scraper = "0.27"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
url = "2"
regex = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
